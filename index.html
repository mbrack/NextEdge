<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Element-Simulator Eiskunstlauf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: Bühne mit Zeitachse klebt oben (Handy), darunter Register; ab 900px Bühne links, Register rechts.
   Farbe trägt Bedeutung: Blau = Auswärtskante, Rot = Einwärtskante, Bernstein = Standbein. Bedienung bleibt in Tinte. */
:root{
  --bg:#EAF0F4; --panel:#FFFFFF; --ink:#0F2233; --muted:#566878; --line:#D0DBE3; --chip:#E1EAF0;
  --out:#1757C2; --in:#D23B32; --flat:#75838F; --support:#E39A00; --air:#9AA9B5;
  --stage-top:#D3E2EB; --stage-bot:#F1F6F9; --ice:#F3F8FB; --ice-line:#B4C9D6; --on-ink:#FFFFFF;
  --skinline:#00000022; --shadow:rgba(15,34,51,.2);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A141C; --panel:#12212E; --ink:#E7EFF4; --muted:#8FA4B4; --line:#25394A; --chip:#1B3040;
    --out:#62A0FF; --in:#FF6F61; --flat:#8A99A6; --support:#FFC043; --air:#5E7384;
    --stage-top:#0C1A25; --stage-bot:#15293A; --ice:#1B3345; --ice-line:#31516A; --on-ink:#0A141C;
    --skinline:#FFFFFF22; --shadow:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A141C; --panel:#12212E; --ink:#E7EFF4; --muted:#8FA4B4; --line:#25394A; --chip:#1B3040;
  --out:#62A0FF; --in:#FF6F61; --flat:#8A99A6; --support:#FFC043; --air:#5E7384;
  --stage-top:#0C1A25; --stage-bot:#15293A; --ice:#1B3345; --ice-line:#31516A; --on-ink:#0A141C;
  --skinline:#FFFFFF22; --shadow:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--out);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;padding-block:10px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.left{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:8px;display:grid;gap:8px;min-width:0}
.right{min-width:0}
.sheetBody{min-width:0;display:grid;gap:12px;align-content:start}
.grip{display:none}
@media(min-width:900px){
  .app{grid-template-columns:minmax(0,1.3fr) minmax(330px,.7fr);align-items:start;gap:20px}
  .left{top:calc(env(safe-area-inset-top,0px) + 10px)}
}
.stage{position:relative;height:clamp(250px,42vh,330px);border-radius:14px;overflow:hidden;background:linear-gradient(var(--stage-top),var(--stage-bot));border:1px solid var(--line)}
@media(min-width:900px){.stage{height:clamp(380px,62vh,620px)}}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.hud{position:absolute;display:flex;gap:6px;align-items:center;pointer-events:none}
.hud.tl{top:10px;left:10px;right:236px;flex-wrap:wrap}
.hud.tr{top:10px;right:10px;pointer-events:auto}
.tools{flex-direction:column;align-items:flex-end;gap:5px}
.views{display:flex;gap:4px}
.seg.sm{background:var(--panel);border:1px solid var(--line);padding:1px}
.seg.sm button{font-size:13px;padding:2px 7px;text-transform:uppercase;letter-spacing:.05em}
#bMax{display:grid;place-items:center;padding:3px 7px}
#bMax[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.left.max{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px))}
.left.max .stage{flex:1;height:auto;min-height:0}
.left.max .legend{display:none}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo{display:grid;gap:6px;justify-items:start;min-width:0}
.pv{width:100%;max-width:150px;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible+label{outline:2px solid var(--out);outline-offset:2px}
label.btn{cursor:pointer}
.cam{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#000;color:#fff;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.camTop{display:grid;gap:2px;padding:8px 12px;font-size:13px}
.camTop b{font-family:var(--f-display);font-size:18px}
.camStage{position:relative;flex:1;min-height:0;overflow:hidden}
.camStage video,.camStage canvas{position:absolute;inset:0;width:100%;height:100%}
.camStage video{object-fit:cover}
.camStage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;max-width:none}
.cam a.btn{text-decoration:none;display:inline-block}
#camCount{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:120px;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
.camBar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 12px}
.cam .btn{color:#fff;border-color:#ffffff66}
.cam .camGo{background:#fff;color:#000;border-color:#fff;font-weight:600}
.fin{width:100%;max-width:100%;font-size:13px}
.pst{font-size:13px;padding:6px 8px}
.pv.over{outline:2px dashed var(--out);outline-offset:2px}
#bFig{display:grid;place-items:center;padding:3px 6px}
#bFig[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.ctlh{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.ctlv{display:inline-flex;gap:6px;align-items:center}
.rs{border:1px solid var(--line);background:transparent;border-radius:6px;width:26px;height:22px;padding:0;line-height:1;font-size:14px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}
.vrow .f{display:grid;gap:4px;min-width:0}
.vlist{display:grid;gap:6px;font-size:14px}
.vlist small{color:var(--muted)}
a.ref{color:var(--out);text-underline-offset:3px;overflow-wrap:anywhere}
.refs{display:grid;gap:4px;font-size:14px}
.hud.bl{bottom:8px;left:10px;right:10px;font-family:var(--f-display);font-size:14px;letter-spacing:.02em;color:var(--muted);font-variant-numeric:tabular-nums}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05;letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;text-wrap:balance}
.code{font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--ink);color:var(--on-ink);padding:1px 7px 2px;border-radius:5px;letter-spacing:.04em}
.chip{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:1px 8px 2px;border-radius:999px;white-space:nowrap}
#hEdge{text-transform:none}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--flat)}
.hudrow{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.views button{padding:3px 7px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);border-radius:7px}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-130%);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.03em;background:var(--ink);color:var(--on-ink);padding:1px 7px 2px;border-radius:5px;white-space:nowrap;pointer-events:none}
.tag.edge{transform:translate(12px,-50%);border:2px solid var(--flat)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ib{width:40px;height:36px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.ib.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink);width:52px}
.ib svg{width:18px;height:18px;fill:currentColor}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 9px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.grow{flex:1}
.tline{position:relative;border-radius:9px;background:var(--panel);border:1px solid var(--line);padding:5px 6px 4px}
.tline:focus-within{outline:2px solid var(--out);outline-offset:2px}
.phases{display:flex;gap:2px;height:22px}
.ph{min-width:0;overflow:hidden;background:var(--chip);border-radius:4px;font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;line-height:22px;padding:0 5px;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.ph.on{background:var(--ink);color:var(--on-ink)}
.edges{display:flex;height:6px;margin-top:3px;border-radius:3px;overflow:hidden}
.edges span{display:block;height:100%}
.e1{background:var(--out)}.e2{background:var(--in)}.e0{background:var(--flat)}
.ea{background:repeating-linear-gradient(135deg,var(--air) 0 3px,transparent 3px 6px)}
.keys{position:relative;height:16px;margin-top:2px}
.keys button{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--muted);background:var(--panel);padding:0}
.keys button[aria-pressed="true"]{background:var(--support);border-color:var(--ink)}
#scrub{position:absolute;left:6px;right:6px;top:0;height:38px;width:calc(100% - 12px);margin:0;opacity:0;cursor:ew-resize}
.head{position:absolute;top:3px;bottom:18px;width:2px;margin-left:5px;background:var(--support);pointer-events:none;box-shadow:0 0 0 1px var(--panel)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tabs{display:flex;width:100%}
.tabs.seg button{flex:1;padding:7px 4px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:14px}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ellist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.el{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.el span:first-child{min-width:0;overflow-wrap:anywhere}
.el[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.el .c{font-family:var(--f-display);font-weight:600;color:var(--muted);letter-spacing:.04em}
.ctl{display:grid;gap:2px}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ctl output{font-family:var(--f-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--ink);margin:2px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.lbl{font-size:14px;min-width:92px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--ink)}
.check i{width:10px;height:10px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;margin:0}
.stats div{min-width:0}
.stats dt{font-size:12.5px;color:var(--muted)}
.stats dd{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.warn{font-size:14px;margin:0;padding:8px 10px;border-radius:8px;border:1px solid var(--in);color:var(--ink)}
.names{display:grid;gap:2px}
.names b{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05}
.names small{color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.prose{margin:0;max-width:65ch}
ol.tips{margin:0;padding-left:20px;display:grid;gap:6px;max-width:65ch}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
textarea{min-height:92px;resize:vertical}
.btn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:14px}
.btn.solid{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:1px solid var(--skinline);padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
details{border:1px solid var(--line);border-radius:9px;padding:0 10px}
details[open]{padding-bottom:10px}
summary{padding:8px 0;font-weight:600;cursor:pointer}
details .ctl{margin-top:6px}
select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px;max-width:100%;min-width:0;flex:1}
/* Handy: Animation füllt den Bildschirm, Details als Blatt von unten (Querformat: von rechts) */
@media (max-width:899px),(max-height:520px){
  html,body{height:100%;overflow:hidden}
  .app{display:block;max-width:none;height:100%;padding:0;--closed:calc(70px + env(safe-area-inset-bottom,0px));--half:46vh;--pad:var(--closed);--sh:var(--closed)}
  .app[data-sheet="half"]{--pad:var(--half);--sh:var(--half)}
  .app[data-sheet="full"]{--pad:var(--half);--sh:calc(100vh - env(safe-area-inset-top,0px) - 44px)}
  .left{position:fixed;inset:0;top:0;z-index:5;display:flex;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(var(--pad) + 6px) max(10px,env(safe-area-inset-left,0px));transition:padding .25s ease}
  .left .stage{flex:1;height:auto;min-height:0}
  .left .legend,#bMax{display:none}
  .right{position:fixed;left:0;right:0;bottom:0;height:var(--sh);z-index:60;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 26px var(--shadow);padding:0 max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px));transition:height .25s ease}
  .grip{display:grid;place-items:center;flex:none;width:100%;height:24px;border:0;background:transparent;touch-action:none;cursor:grab}
  .grip i{display:block;width:44px;height:4px;border-radius:2px;background:var(--muted);opacity:.6}
  .sheetBody{display:flex;flex-direction:column;gap:0;flex:1;min-height:0}
  .sheetBody .tabs{flex:none}
  .sheetBody .pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;border:0;border-radius:0;padding:14px 2px 24px;align-content:start}
  .app[data-sheet="closed"] .pane{display:none}
  .app[data-sheet="half"] #segFocus,.app[data-sheet="half"] #segLabel{display:none}
  .transport{gap:6px;flex-wrap:nowrap}
  .ib{width:34px}.ib.primary{width:44px}
  #segSpeed{flex-wrap:nowrap}
  #segSpeed button{padding:5px 6px;font-size:14px}
}
@supports (height:1dvh){@media (max-width:899px),(max-height:520px){
  .app{--half:46dvh}
  .app[data-sheet="full"]{--sh:calc(100dvh - env(safe-area-inset-top,0px) - 44px)}
}}
@media (max-height:520px) and (orientation:landscape){
  .app{--sw:44px}
  .app[data-sheet="half"],.app[data-sheet="full"]{--sw:50%}
  .left{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-right:calc(var(--sw) + 8px)}
  .right{left:auto;top:0;width:var(--sw);height:auto;flex-direction:row;border-top:0;border-left:1px solid var(--line);border-radius:16px 0 0 16px;box-shadow:-8px 0 26px var(--shadow);padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) 0;transition:width .25s ease}
  .grip{width:28px;height:auto}
  .grip i{width:4px;height:44px}
  .app[data-sheet="closed"] .grip{width:100%}
  .app[data-sheet="closed"] .sheetBody{display:none}
  .sheetBody{padding-top:8px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}.left,.right{transition:none}}
</style>

<div class="app" id="app" data-sheet="half">
  <section class="left" id="left" aria-label="Simulator">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="3D-Ansicht der Figur. Ziehen dreht die Kamera, Zoomen mit zwei Fingern oder Mausrad."></canvas>
      <div class="hud tl">
        <h1><span id="hName">Axel</span><span class="code" id="hCode">1A</span></h1>
        <div class="hudrow"><span class="chip" id="hPhase">Anlauf</span><span class="chip" id="hEdge"><i></i>LFO</span></div>
      </div>
      <div class="hud tr tools">
        <div class="views">
          <button type="button" data-view="side">Seite</button>
          <button type="button" data-view="front">Vorne</button>
          <button type="button" data-view="top">Oben</button>
          <button type="button" id="bFig" aria-pressed="false" aria-label="Foto-Textur ein oder aus"><svg viewBox="0 0 20 20" width="14" height="14"><circle cx="10" cy="4.5" r="3" fill="currentColor"/><path fill="currentColor" d="M4 19c0-6 2-9 6-9s6 3 6 9z"/></svg></button>
          <button type="button" id="bMax" aria-pressed="false" aria-label="Animationsfenster maximieren"><svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M3 3h6v2H5v4H3zM17 17h-6v-2h4v-4h2z"/></svg></button>
        </div>
        <div class="seg sm" id="segFocus" role="group" aria-label="Fokus der Kamera"></div>
        <div class="seg sm" id="segLabel" role="group" aria-label="Beschriftung"></div>
      </div>
      <div class="hud bl" id="hStats"></div>
      <div id="tags"></div>
      <p class="nogl" id="nogl" hidden>Die 3D-Ansicht konnte nicht gestartet werden. Bitte die Seite neu laden oder einen anderen Browser versuchen.</p>
    </div>
    <div class="transport">
      <button type="button" class="ib" id="bRestart" aria-label="Zum Anfang"><svg viewBox="0 0 20 20"><path d="M4 3h2v14H4zM17 3v14L7 10z"/></svg></button>
      <button type="button" class="ib" id="bBack" aria-label="Ein Bild zurück"><svg viewBox="0 0 20 20"><path d="M13 3v14L4 10z"/><path d="M15 3h2v14h-2z"/></svg></button>
      <button type="button" class="ib primary" id="bPlay" aria-label="Abspielen"><svg viewBox="0 0 20 20" id="icoPlay"><path d="M5 3l12 7-12 7z"/></svg></button>
      <button type="button" class="ib" id="bFwd" aria-label="Ein Bild vor"><svg viewBox="0 0 20 20"><path d="M7 3v14l9-7z"/><path d="M3 3h2v14H3z"/></svg></button>
      <span class="grow"></span>
      <div class="seg" id="segSpeed" role="group" aria-label="Abspieltempo"></div>
    </div>
    <div class="tline" id="tline">
      <div class="phases" id="phases"></div>
      <div class="edges" id="edges"></div>
      <div class="keys" id="keys"></div>
      <div class="head" id="head"></div>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Zeitachse">
